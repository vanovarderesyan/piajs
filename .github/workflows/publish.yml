name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run runtime tests
        run: npm test
      - name: Check TypeScript declarations
        run: npm run test:types
      - name: Inspect release package
        run: npm pack --dry-run
      - name: Upgrade npm CLI for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Show registry latest version
        run: npm view piavpnjs version
      - name: Publish release
        run: npm publish
